<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>Gym Check-in</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=20260427f" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayLabel">Today</p>
          <h1 id="workoutTitle">Gym Check-in</h1>
        </div>
        <button class="ghost-button" id="syncButton" type="button">同步</button>
      </header>

      <main id="app" aria-live="polite"></main>

      <nav class="tabbar" aria-label="Primary">
        <button class="tab active" data-route="today" type="button">今日</button>
        <button class="tab" data-route="equipment" type="button">设备</button>
        <button class="tab" data-route="plan" type="button">计划</button>
        <button class="tab" data-route="history" type="button">历史</button>
        <button class="tab" data-route="settings" type="button">设置</button>
      </nav>
    </div>

    <template id="setRowTemplate">
      <div class="set-row">
        <span class="set-number"></span>
        <label>
          <span>重量</span>
          <input inputmode="decimal" name="weight" placeholder="lb" />
        </label>
        <label>
          <span>次数</span>
          <input inputmode="numeric" name="reps" placeholder="0" />
        </label>
        <label>
          <span>RIR</span>
          <input inputmode="numeric" name="rir" placeholder="2" />
        </label>
        <button class="check-button" type="button" aria-label="完成这一组"></button>
      </div>
    </template>

    <script src="/app.js?v=20260427f" type="module"></script>
  </body>
</html>
